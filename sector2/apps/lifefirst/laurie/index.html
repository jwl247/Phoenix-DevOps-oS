<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Life First</title>
<style>
  :root {
    --bg: #12161f;
    --card: #1b2130;
    --card-border: rgba(120, 200, 255, 0.18);
    --text: #eef3f8;
    --text-dim: #9fb0c3;
    --accent: #6fd3ff;
    --warn: #ffcc66;
    --ok: #7ee0a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    padding: 22px 18px 60px;
  }
  .greeting {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .subline {
    color: var(--text-dim);
    font-size: 15px;
    margin-bottom: 26px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .card-body {
    font-size: 17px;
    line-height: 1.6;
  }
  .loading { color: var(--text-dim); font-style: italic; }

  .notif {
    border-left: 4px solid var(--warn);
    background: rgba(255, 204, 102, 0.08);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .notif-text { font-size: 16px; margin-bottom: 12px; line-height: 1.5; }
  .notif-btn {
    display: inline-block;
    background: var(--accent);
    color: #06202b;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .notif-btn:active { opacity: 0.8; }

  .all-clear {
    color: var(--ok);
    font-size: 16px;
  }
  .footnote {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    margin-top: 30px;
    line-height: 1.6;
  }
</style>
</head>
<body>

  <div class="greeting">Hi Laurie</div>
  <div class="subline" id="subline">Here's your day.</div>

  <div class="card">
    <div class="card-title">Today</div>
    <div class="card-body loading" id="today">loading…</div>
  </div>

  <div id="notifications"></div>

  <div class="footnote">This page checks in on its own — you don't need to refresh it.<br>If anything looks wrong, it's easier than it sounds to fix. Just tell Jerry.</div>

<script>
  const $today = document.getElementById('today');
  const $notifs = document.getElementById('notifications');
  const $sub = document.getElementById('subline');

  async function callProxy(op, body) {
    const opts = { method: body ? 'POST' : 'GET' };
    if (body) {
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(`proxy.php?op=${op}`, opts);
    return res.json();
  }

  function extractText(resp) {
    // The API's shape varies by module; take the most human string it gives us.
    const r = resp && resp.data ? resp.data.response : (resp && resp.response);
    if (!r) return null;
    return r.message || r.reply || r.content || (typeof r === 'string' ? r : null);
  }

  async function loadToday() {
    try {
      const resp = await callProxy('today');
      const text = extractText(resp);
      $today.textContent = text || "Nothing on the books — a clear day.";
      $today.classList.remove('loading');
    } catch (e) {
      $today.textContent = "Couldn't check just now — try again in a bit.";
      $today.classList.remove('loading');
    }
  }

  async function loadNotifications() {
    try {
      const resp = await callProxy('check_notifications');
      const data = resp && resp.data && resp.data.response;
      const list = (data && data.notifications) || [];
      if (!list.length) {
        $notifs.innerHTML = '<div class="card"><div class="all-clear">✓ All clear — nothing waiting on you.</div></div>';
        return;
      }
      $notifs.innerHTML = list.map(n => `
        <div class="notif" data-id="${n.notification_id}">
          <div class="notif-text">${escapeHtml(n.message_text || '')}</div>
          <button class="notif-btn" onclick="acknowledge(${n.notification_id}, this)">Got it</button>
        </div>
      `).join('');
    } catch (e) {
      // Stay quiet on transient errors — don't alarm her over a network blip.
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function acknowledge(id, btn) {
    btn.textContent = '…';
    btn.disabled = true;
    try {
      await callProxy('acknowledge', { notification_id: id });
      btn.closest('.notif').remove();
      if (!document.querySelector('.notif')) {
        $notifs.innerHTML = '<div class="card"><div class="all-clear">✓ All clear — nothing waiting on you.</div></div>';
      }
    } catch (e) {
      btn.textContent = 'Got it';
      btn.disabled = false;
    }
  }

  loadToday();
  loadNotifications();
  // Quiet background check — this is what makes the escalation tree actually
  // reach her without her having to remember to open the page.
  setInterval(loadNotifications, 30000);
</script>
</body>
</html>
