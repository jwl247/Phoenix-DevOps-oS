# wg0-phoenix-ext.conf — WireGuard peer (Phoenix external drive)
# Phoenix DevOps — jwl247
#
# INSTALL ON PHOENIX EXTERNAL:
#   sudo apt-get install -y wireguard
#   sudo cp wg0-phoenix-ext.conf /etc/wireguard/wg0.conf
#   sudo chmod 600 /etc/wireguard/wg0.conf
#   sudo systemctl enable wg-quick@wg0
#   sudo systemctl start  wg-quick@wg0
#
# OR use the Phoenix service:
#   sudo cp sector3/services/phoenix-wireguard.service /etc/systemd/system/
#   sudo systemctl enable --now phoenix-wireguard.service
#
# Windows LAN IP: 192.168.1.100
# If accessing from outside the LAN, update Endpoint to your public IP.
#   Find public IP on Windows: curl https://ifconfig.me
# =============================================================================

[Interface]
PrivateKey = QLYBYAiysrvBCUZCEms6QsJjX38m690JxROfTXCVwEU=
Address    = 10.77.0.3/24
DNS        = 1.1.1.1

# ── Peer: Windows hub ────────────────────────────────────────────────────────
[Peer]
PublicKey  = 6PDPfBiZHIghQ7b99dTVuYHRgQKUqaQ+SNk1nIBUcBA=
# Windows LAN IP — update to public IP for access outside home network
Endpoint   = 192.168.1.100:51820
AllowedIPs = 10.77.0.0/24
PersistentKeepalive = 25
