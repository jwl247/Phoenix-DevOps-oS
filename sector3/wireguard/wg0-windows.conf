# wg0-windows.conf — WireGuard hub (Windows machine)
# Phoenix DevOps — jwl247
#
# INSTALL ON WINDOWS:
#   1. Download WireGuard for Windows: https://www.wireguard.com/install/
#   2. Copy this file to: C:\Program Files\WireGuard\wg0.conf
#      OR open WireGuard app → Add Tunnel → paste this config
#   3. Forward UDP port 51820 on your router → this Windows machine's LAN IP
#   4. Find your public IP: https://ifconfig.me
#      Replace YOUR_PUBLIC_IP below in the WSL and EXT configs
#   5. Click Activate in the WireGuard app
#
# NETWORK MAP:
#   windows-host  10.77.0.1  (this machine — hub)
#   wsl           10.77.0.2  (WSL2 peer)
#   phoenix-ext   10.77.0.3  (external drive peer)
# =============================================================================

[Interface]
PrivateKey = 0NLY4saJYkBuOzpsZg/vVrZjLemoLHNV6DZh7NmBXEE=
Address    = 10.77.0.1/24
ListenPort = 51820
DNS        = 1.1.1.1

# Keep Surfshark running alongside — WireGuard uses a separate adapter
# No routing conflict as long as Surfshark is set to split-tunnel or
# you exclude the 10.77.0.0/24 subnet from Surfshark's routes.

# ── Peer: WSL ────────────────────────────────────────────────────────────────
[Peer]
# WSL2 on this same physical machine
PublicKey  = 58fmAqBeIN6FdOQ1Iiho3DpIBl+b5Cl9rZos85ZFrw4=
AllowedIPs = 10.77.0.2/32

# ── Peer: Phoenix external drive ─────────────────────────────────────────────
[Peer]
PublicKey  = +/WaVPM/0bC/AQSq2FMiPadA8j6PU65iJDVDdu+3qjo=
AllowedIPs = 10.77.0.3/32
# PersistentKeepalive keeps the tunnel alive when phoenix-ext is behind NAT
PersistentKeepalive = 25
