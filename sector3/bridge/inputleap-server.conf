# Input Leap — server config (runs on Windows)
# Phoenix DevOps — jwl247
#
# Windows copy to:
#   %USERPROFILE%\AppData\Local\InputLeap\InputLeap.conf
#
# Screen layout:
#   [ windows-host ] [ phoenix-ext ]
#   Mouse exits RIGHT edge of Windows → enters Linux
#
# When switching to Synergy on Friday:
#   Copy this file to %APPDATA%\Synergy\synergy.conf — same format.
# ─────────────────────────────────────────────────────────────────

section: screens
	windows-host:
		halfDuplexCapsLock = false
		halfDuplexNumLock = false
		halfDuplexScrollLock = false
		xtestIsXineramaUnaware = false
		preserveFocus = false
		switchCorners = none
		switchCornerSize = 0
	phoenix-ext:
		halfDuplexCapsLock = false
		halfDuplexNumLock = false
		halfDuplexScrollLock = false
		xtestIsXineramaUnaware = false
		preserveFocus = false
		switchCorners = none
		switchCornerSize = 0
end

section: aliases
end

section: links
	windows-host:
		right = phoenix-ext
	phoenix-ext:
		left = windows-host
end

section: options
	relativeMouseMoves = false
	trayIcon = true
	screenSaverSync = true
	win32KeepForeground = false
	clipboardSharing = true
	clipboardSharingSize = 32
	switchDelay = 250
	switchDoubleTap = 250
	heartbeat = 5000
end
