<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #0a0c10; overflow: hidden;
    font: 15px -apple-system,"Segoe UI",system-ui,sans-serif; }
  .wrap { position: relative; width: 100%; height: 100%; }
  .bird { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0.92; }
  .scrim { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,12,16,0.15) 0%, rgba(10,12,16,0.55) 65%, rgba(10,12,16,0.92) 100%); }
  .title { position: absolute; left: 0; right: 0; bottom: 38px; text-align: center; color: #e8edf4; }
  .title .name { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  .title .tag { font-size: 12px; color: #9aa7b8; margin-top: 4px; }
  .bar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: 160px; height: 3px; border-radius: 999px; background: #1b212c; overflow: hidden; }
  .bar .beam { position: absolute; top: 0; left: -30%; width: 30%; height: 100%;
    background: #ffb454; border-radius: 999px; animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0%{left:-30%} 50%{left:100%} 100%{left:-30%} }
</style>
</head>
<body>
  <div class="wrap">
    <img class="bird" src="assets/phoenix-logo.png" alt="">
    <div class="scrim"></div>
    <div class="title">
      <div class="name">Phoenix Office</div>
      <div class="tag">Secretariat is waking up…</div>
    </div>
    <div class="bar"><div class="beam"></div></div>
  </div>
</body>
</html>
