# ============================================================
# helix_mesh.conf — Helix Mesh Configuration
# Project:   Phoenix DevOps / Full Propagator Framework
# ============================================================

[mesh]
version         = 1.4.0
upstream        = upstream_brain
downstream      = downstream_storage
mount_point     = /opt2
lib             = libhelix.so

[ports]
memory          = helix://mem:5570
storage         = helix://fs:5571
network         = helix://net:5572
compute         = helix://cpu:5573
com             = helix://com:5574
vault           = helix://vault:5575

[tiers]
L1_threshold    = 60
L2_threshold    = 75
L3_threshold    = 88
critical        = 88

[peers]
# The Phoenix Mesh (sector3/phoenix-net, WireGuard) keeps <name>.phx in
# /etc/hosts on every member, so peers are named, never numbered. The
# ingress half of the Helix team (Romeo) pushes to the egress half (Juliet)
# at <peer>:5581 with PHOENIX_RJ_PEER; the hop is HMAC-signed
# (PHOENIX_RJ_SECRET, from the vault). Frank-to-Frank sideload: 5557.
precision       = precision.phx
compaq          = compaq.phx
pbm3            = pbm3.phx
juliet_port     = 5581
juliet_egress   = 5582
romeo_port      = 5580
sideload_port   = 5557

[security]
gpu_blacklisted = true
hardware_auth   = phoenix_auth.py
hash_algo       = SHA3-512+BLAKE2b
