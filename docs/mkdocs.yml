site_name: Portable Glossary & TOC Book
site_url: https://example.com  # change if you publish

theme:
  name: mkdocs

markdown_extensions:
  - toc:
      permalink: true

nav:
  - Index: index.md
  - Table of Contents: toc.md
  - Glossary:
      - A–Z Index: glossary/index.md
      - By Category: glossary/categories.md

# Add small UI tweaks (sticky A–Z bar + search)
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/rolodex.js
  - javascripts/glossary_search.js
